services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: propcompare
      POSTGRES_PASSWORD: propcompare_dev_only
      POSTGRES_DB: propcompare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propcompare -d propcompare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
